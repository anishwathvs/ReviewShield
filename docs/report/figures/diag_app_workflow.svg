<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 690" width="700" height="690"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker></defs><rect x="230" y="10" width="240" height="40" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="26.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Open application</text><text x="350.0" y="42.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">landing page</text><path d="M350,50 L350,70" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="70" width="240" height="40" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="86.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Log in / Continue as Demo User</text><text x="350.0" y="101.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">session-only, no credential check</text><path d="M350,110 L350,130" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="130" width="240" height="40" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="146.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Analyze Review page</text><text x="350.0" y="162.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">type, paste or choose a sample</text><path d="M350,170 L350,190" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><polygon points="350,191.0 460.0,222 350,253.0 240.0,222" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="350" y="226" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Review text empty?</text><path d="M460,222 L520,222" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><text x="488" y="215" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle" font-style="italic">yes</text><rect x="520" y="200" width="160" height="44" rx="4" fill="#FBE3DC" stroke="#B5452B" stroke-width="1.3"/><text x="600.0" y="218.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Show warning</text><text x="600.0" y="233.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">no prediction made</text><path d="M350,253 L350,283" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><text x="362" y="272" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle" font-style="italic">no</text><polygon points="350,284.0 460.0,315 350,346.0 240.0,315" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="350" y="319" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Model artifacts present?</text><path d="M460,315 L520,315" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><text x="488" y="308" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle" font-style="italic">no</text><rect x="520" y="293" width="160" height="44" rx="4" fill="#FBE3DC" stroke="#B5452B" stroke-width="1.3"/><text x="600.0" y="311.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">“Model not trained”</text><text x="600.0" y="326.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">status = not_trained</text><path d="M350,346 L350,372" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><text x="364" y="364" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle" font-style="italic">yes</text><rect x="230" y="372" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="389.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Preprocess text</text><text x="350.0" y="405.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">clean_text()</text><path d="M350.0,414 L350.0,430" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="430" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="447.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Load cached vectorizer + model</text><text x="350.0" y="463.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">joblib (first call only)</text><path d="M350.0,472 L350.0,488" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="488" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="505.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Transform text and predict class</text><text x="350.0" y="521.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">TF-IDF → Multinomial NB</text><path d="M350.0,530 L350.0,546" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="546" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="563.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Display verdict and likelihoods</text><text x="350.0" y="579.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">Likely Fake / Likely Genuine</text><path d="M350.0,588 L350.0,604" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="230" y="604" width="240" height="42" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="621.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Display language signals</text><text x="350.0" y="637.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">supporting indicators only</text><path d="M470,582 L520,582" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="520" y="560" width="160" height="44" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="600.0" y="578.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Record in history</text><text x="600.0" y="593.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">bookmark / download (optional)</text><path d="M230,582 L90,582 L90,150 L230,150" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="5,3"/><text x="80" y="372" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" font-style="italic" fill="#333333" text-anchor="middle" transform="rotate(-90 80 372)">analyse another review</text></svg>