<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker></defs><text x="250" y="18" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1F3864" text-anchor="middle" font-weight="bold">Streamlit web application (app.py)</text><rect x="60" y="88" width="380" height="140" rx="6" fill="none" stroke="#1F3864" stroke-dasharray="6,4"/><rect x="60" y="250" width="380" height="372" rx="6" fill="none" stroke="#1F3864" stroke-dasharray="6,4"/><text x="68" y="104" font-family="Liberation Serif, Times New Roman, serif" font-size="11" fill="#1F3864" text-anchor="start" font-style="italic">Presentation layer</text><text x="68" y="266" font-family="Liberation Serif, Times New Roman, serif" font-size="11" fill="#1F3864" text-anchor="start" font-style="italic">ML inference layer (src/)</text><rect x="150" y="28" width="200" height="40" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="250.0" y="44.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">User</text><text x="250.0" y="60.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">web browser</text><path d="M250,68 L250,112" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><text x="258" y="82" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="start" font-style="italic">enters / pastes review</text><rect x="100" y="112" width="300" height="44" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="250.0" y="130.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Streamlit interface</text><text x="250.0" y="146.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">landing, session, dashboard, analyse, compare</text><path d="M250,156 L250,172" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="100" y="172" width="300" height="44" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="250.0" y="190.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Review input + validation</text><text x="250.0" y="206.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">empty-text check, sample reviews</text><path d="M250,216 L250,278" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><text x="258" y="242" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="start" font-style="italic">predict_review(text)</text><rect x="100" y="278" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="250.0" y="299.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Text preprocessing</text><text x="250.0" y="315.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">clean_text()  ·  extract_review_heuristics()</text><path d="M250.0,328 L250.0,350" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="100" y="350" width="300" height="50" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="250.0" y="371.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">TF-IDF vectorizer</text><text x="250.0" y="387.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">vectorizer.transform([cleaned])</text><path d="M250.0,400 L250.0,422" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="100" y="422" width="300" height="50" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="250.0" y="443.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Multinomial Naive Bayes model</text><text x="250.0" y="459.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">predict()  ·  predict_proba()</text><path d="M250.0,472 L250.0,494" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="100" y="494" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="250.0" y="515.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Prediction</text><text x="250.0" y="531.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">Likely Fake / Likely Genuine + class likelihoods</text><path d="M250.0,544 L250.0,566" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="100" y="566" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="250.0" y="587.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Review insights</text><text x="250.0" y="603.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">word count, characters, exclamations, all-caps, hype phrases</text><path d="M250,628 L250,650" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="150" y="650" width="200" height="40" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="250.0" y="666.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Result shown to user</text><text x="250.0" y="682.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">verdict, likelihood bars, signals</text><text x="590" y="300" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1F3864" text-anchor="middle" font-weight="bold">Stored artifacts (models/)</text><rect x="500" y="318" width="180" height="44" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="590.0" y="336.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">vectorizer.pkl</text><text x="590.0" y="351.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">fitted TfidfVectorizer</text><rect x="500" y="390" width="180" height="44" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="590.0" y="408.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">model.pkl</text><text x="590.0" y="423.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">trained MultinomialNB</text><rect x="500" y="462" width="180" height="44" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="590.0" y="480.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">metrics.json</text><text x="590.0" y="495.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">verified test metrics</text><path d="M500,340 L400,375" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="5,3"/><path d="M500,412 L400,447" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="5,3"/><text x="590" y="530" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-style="italic">loaded once with joblib.load()</text><text x="590" y="545" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-style="italic">and cached in memory</text><rect x="500" y="160" width="180" height="56" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3" stroke-dasharray="5,3"/><text x="590.0" y="178.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Session state</text><text x="590.0" y="193.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">history, saved reviews,</text><text x="590.0" y="205.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">preferences (in memory)</text><path d="M400,194 L500,188" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="5,3"/></svg>