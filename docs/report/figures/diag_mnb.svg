<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker></defs><rect x="250" y="12" width="200" height="48" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="32.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">TF-IDF feature vector x</text><text x="350.0" y="48.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">1 × 25,000 (from vectorizer.pkl)</text><rect x="40" y="100" width="280" height="62" rx="4" fill="#FBE3DC" stroke="#B5452B" stroke-width="1.3"/><text x="180.0" y="127.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Class Fake (CG)</text><text x="180.0" y="143.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">log P(Fake) + Σ xᵢ · log P(wᵢ | Fake)</text><rect x="380" y="100" width="280" height="62" rx="4" fill="#DDE8F6" stroke="#2A6EBB" stroke-width="1.3"/><text x="520.0" y="127.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Class Genuine (OR)</text><text x="520.0" y="143.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">log P(Genuine) + Σ xᵢ · log P(wᵢ | Genuine)</text><path d="M350,60 L350,80 L180,80 L180,100" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><path d="M350,80 L520,80 L520,100" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="215" y="172" width="270" height="62" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3" stroke-dasharray="5,3"/><text x="350.0" y="193.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Learned in training (model.pkl)</text><text x="350.0" y="208.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">class priors P(c) from class frequencies;</text><text x="350.0" y="220.5" font-family="Liberation Serif, Times New Roman, serif" font-size="10.5" fill="#333333" text-anchor="middle">P(w | c) with Laplace smoothing, alpha = 1.0</text><path d="M180,162 L180,245 L300,245 L300,255" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><path d="M520,162 L520,245 L400,245 L400,255" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="220" y="255" width="260" height="30" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="350.0" y="272.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">argmax over the two class scores</text><path d="M300,285 L240,302" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><path d="M400,285 L460,302" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="110" y="302" width="170" height="26" rx="4" fill="#FBE3DC" stroke="#B5452B" stroke-width="1.3"/><text x="195.0" y="317.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Likely Fake</text><rect x="420" y="302" width="170" height="26" rx="4" fill="#DDE8F6" stroke="#2A6EBB" stroke-width="1.3"/><text x="505.0" y="317.5" font-family="Liberation Serif, Times New Roman, serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Likely Genuine</text></svg>