<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker></defs><rect x="20" y="25" width="148" height="70" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="94.0" y="50.0" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Dataset</text><text x="94.0" y="66.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">fake reviews dataset.csv</text><text x="94.0" y="79.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">40,432 rows</text><path d="M168,60 L204,60" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="204" y="25" width="148" height="70" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="278.0" y="50.0" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Validation</text><text x="278.0" y="66.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">schema, missing,</text><text x="278.0" y="79.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">duplicates, labels</text><path d="M352,60 L388,60" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="388" y="25" width="148" height="70" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="462.0" y="50.0" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Cleaning</text><text x="462.0" y="66.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">drop duplicate texts</text><text x="462.0" y="79.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">and empty rows</text><path d="M536,60 L572,60" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="572" y="25" width="148" height="70" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="646.0" y="50.0" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Preprocessing</text><text x="646.0" y="66.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">clean_text()</text><text x="646.0" y="79.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">lowercase, URLs, stopwords</text><path d="M646.0,95 L646.0,120 L94.0,120 L94.0,145" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="20" y="145" width="148" height="70" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="94.0" y="170.0" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Stratified Split</text><text x="94.0" y="186.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">80% train / 20% test</text><text x="94.0" y="199.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">random_state = 42</text><path d="M168,180 L204,180" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="204" y="145" width="148" height="70" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="278.0" y="170.0" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">TF-IDF</text><text x="278.0" y="186.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">fit on training text</text><text x="278.0" y="199.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">25,000 features</text><path d="M352,180 L388,180" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="388" y="145" width="148" height="70" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="462.0" y="170.0" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Multinomial NB</text><text x="462.0" y="186.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">alpha = 1.0</text><text x="462.0" y="199.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">fit on train vectors</text><path d="M536,180 L572,180" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="572" y="145" width="148" height="70" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="646.0" y="170.0" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Evaluation</text><text x="646.0" y="186.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">unseen 8,083</text><text x="646.0" y="199.0" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">test reviews</text><path d="M646.0,215 L646.0,240" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="388" y="240" width="332" height="46" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="554.0" y="259.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="m