 New Roman, serif" font-size="13" fill="#1F3864" text-anchor="middle" font-weight="bold">src/predict.py → predict_review(raw_review)</text><text x="350" y="175" font-family="Liberation Serif, Times New Roman, serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Returned keys: status, raw_prediction, predicted_class, prediction_label, is_fake,</text><text x="350" y="193" font-family="Liberation Serif, Times New Roman, serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">confidence, class_probabilities, cleaned_text, heuristics</text><text x="350" y="222" font-family="Liberation Serif, Times New Roman, serif" font-size="11" fill="#444444" text-anchor="middle" font-style="italic">status = “empty_input” or “not_trained” is returned instead when the input or artifacts are missing.</text></svg>