<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker></defs><rect x="110" y="12" width="420" height="46" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="31.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Raw review text</text><text x="320.0" y="47.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">input string from dataset or user</text><path d="M320.0,58 L320.0,73" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="110" y="73" width="420" height="46" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="92.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">1. Type check</text><text x="320.0" y="108.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">non-string / missing value → empty string</text><path d="M320.0,119 L320.0,134" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="110" y="134" width="420" height="46" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="153.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">2. Lowercase conversion</text><text x="320.0" y="169.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">text.lower()</text><path d="M320.0,180 L320.0,195" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="110" y="195" width="420" height="46" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="214.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">3. URL removal</text><text x="320.0" y="230.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">regex  https?://\S+ | www\.\S+</text><path d="M320.0,241 L320.0,256" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="110" y="256" width="420" height="46" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="275.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">4. HTML tag removal</text><text x="320.0" y="291.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">regex  &lt;.*?&gt;</text><path d="M320.0,302 L320.0,317" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="110" y="317" width="420" height="46" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="336.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">5. Punctuation / symbol / digit removal</text><text x="320.0" y="352.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">regex  [^a-zA-Z\s] → space</text><path d="M320.0,363 L320.0,378" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="110" y="378" width="420" height="46" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="397.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">6. Tokenisation + stopword filtering</text><text x="320.0" y="413.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">split on whitespace; drop NLTK English stopwords and 1-letter tokens</text><path d="M320.0,424 L320.0,439" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="110" y="439" width="420" height="46" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="458.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">7. Whitespace normalisation</text><text x="320.0" y="474.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">tokens re-joined with single spaces</text><path d="M320.0,485 L320.0,500" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="110" y="500" width="420" height="46" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="519.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Clean text</text><text x="320.0" y="535.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">passed to the fitted TF-IDF vectorizer</text><text x="320" y="553" font-family="Liberation Serif, Times New Roman, serif" font-size="11" fill="#333333" text-anchor="middle" font-style="italic">The same clean_text() function is used in training (src/train_model.py) and prediction (src/predict.py).</text></svg>