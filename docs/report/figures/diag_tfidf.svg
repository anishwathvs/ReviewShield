<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker></defs><text x="175" y="20" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Training phase (fit)</text><text x="525" y="20" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Inference phase (transform only)</text><rect x="25" y="35" width="300" height="50" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="175.0" y="56.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Cleaned training reviews</text><text x="175.0" y="72.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">32,328 documents</text><path d="M175.0,85 L175.0,103" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="25" y="103" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="175.0" y="124.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Build n-gram vocabulary</text><text x="175.0" y="140.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">unigrams + bigrams, ngram_range = (1, 2)</text><path d="M175.0,153 L175.0,171" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="25" y="171" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="175.0" y="192.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Filter vocabulary</text><text x="175.0" y="208.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">min_df = 3; keep top 25,000 by frequency</text><path d="M175.0,221 L175.0,239" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="25" y="239" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="175.0" y="260.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Compute IDF weights</text><text x="175.0" y="276.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">idf(t) = ln((1 + n) / (1 + df(t))) + 1</text><path d="M175.0,289 L175.0,307" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="25" y="307" width="300" height="50" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="175.0" y="328.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Training matrix</text><text x="175.0" y="344.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">32,328 × 25,000 sparse, L2-normalised</text><rect x="375" y="35" width="300" height="50" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="525.0" y="56.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Cleaned test review / user review</text><text x="525.0" y="72.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">8,083 test documents or 1 user input</text><path d="M525.0,85 L525.0,103" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="375" y="103" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="525.0" y="124.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Count known n-grams (TF)</text><text x="525.0" y="140.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">terms not in the vocabulary are ignored</text><path d="M525.0,153 L525.0,171" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="375" y="171" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="525.0" y="192.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Multiply by stored IDF</text><text x="525.0" y="208.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">weights learned during fit</text><path d="M525.0,221 L525.0,239" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="375" y="239" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="525.0" y="260.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">L2 normalisation</text><text x="525.0" y="276.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">unit-length row vector</text><path d="M525.0,289 L525.0,307" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="375" y="307" width="300" height="50" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="525.0" y="328.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Feature vector</text><text x="525.0" y="344.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">1 × 25,000 per review</text><path d="M325,240 L375,240" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><text x="350" y="232" font-family="Liberation Serif, Times New Roman, serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">vocab</text><text x="350" y="258" font-family="Liberation Serif, Times New Roman, serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">+ IDF</text><text x="350" y="372" font-family="Liberation Serif, Times New Roman, serif" font-size="11" fill="#333333" text-anchor="middle" font-style="italic">Saved as models/vectorizer.pkl so both phases share one fitted vocabulary.</text></svg>