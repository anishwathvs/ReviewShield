<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker></defs><rect x="70" y="12" width="500" height="54" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="35.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">[1/7] load_dataset()</text><text x="320.0" y="51.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">auto-detect text_ / label; drop missing, empty and duplicate texts → 40,412</text><path d="M320.0,66 L320.0,84" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="70" y="84" width="500" height="54" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="107.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">[2/7] Map labels</text><text x="320.0" y="123.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">CG → Fake,  OR → Genuine</text><path d="M320.0,138 L320.0,156" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="70" y="156" width="500" height="54" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="179.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">[3/7] clean_text() on every review</text><text x="320.0" y="195.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">drop rows empty after cleaning → 40,411 usable reviews</text><path d="M320.0,210 L320.0,228" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="70" y="228" width="500" height="54" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="251.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">[4/7] train_test_split()</text><text x="320.0" y="267.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">test_size = 0.2, stratify = labels, random_state = 42 → 32,328 / 8,083</text><path d="M320.0,282 L320.0,300" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="70" y="300" width="500" height="54" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="323.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">[5/7] TfidfVectorizer.fit_transform(train)</text><text x="320.0" y="339.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">transform(test) with the same vocabulary — no test leakage</text><path d="M320.0,354 L320.0,372" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="70" y="372" width="500" height="54" rx="4" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="395.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">[6/7] MultinomialNB(alpha = 1.0).fit()</text><text x="320.0" y="411.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">learn class priors and smoothed word likelihoods</text><path d="M320.0,426 L320.0,444" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="70" y="444" width="500" height="54" rx="4" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="467.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">[7/7] predict(test) → compute_metrics()</text><text x="320.0" y="483.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">accuracy, precision, recall, F1 (positive class = Fake), confusion matrix</text><path d="M320.0,498 L320.0,516" fill="none" stroke="#404040" stroke-width="1.4" marker-end="url(#ah)"/><rect x="70" y="516" width="500" height="54" rx="4" fill="#F2F2F2" stroke="#1F3864" stroke-width="1.3"/><text x="320.0" y="539.5" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Persist artifacts</text><text x="320.0" y="555.5" font-family="Liberation Serif, Times New Roman, serif" font-size="11.5" fill="#333333" text-anchor="middle">joblib.dump → model.pkl, vectorizer.pkl;  json.dump → metrics.json</text></svg>